name: ironclad

# The gate, in CI — so a pull request cannot skip what the pre-commit hook enforces locally.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  platforms:
    name: Suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # UNKNOWNS U20: the cross-platform claim is only worth something if the check actually ran,
      # and runner images change. Printing the version makes its absence a failure here rather
      # than a silent skip inside the suite.
      - name: PowerShell is present
        shell: bash
        run: pwsh --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Every operator script parses on this platform
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              $e = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
              if ($e.Count) { $bad++; Write-Host "::error file=$($_.Name)::$($e[0].Message)" }
            }
          if ($bad) { exit 1 }

      - name: Test suite
        run: npm test

      - name: The launcher is executable and refuses a missing prerequisite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x ./admin.sh || { echo 'admin.sh is not executable'; exit 1; }
          bash -n ./admin.sh
          # Resolve bash first: with PATH cleared the shebang itself cannot be resolved, so the
          # script would never run and the check would pass for the wrong reason.
          BASH_BIN="$(command -v bash)"
          # Nothing on PATH means every prerequisite is missing. admin.sh uses only builtins
          # until it execs pwsh, so it must still print guidance and exit non-zero.
          out="$(env PATH=/nonexistent "$BASH_BIN" ./admin.sh 2>&1 || true)"
          echo "$out"
          for want in 'PowerShell 7 is not installed' 'Azure CLI is not installed' 'Node.js 20+ is not installed'; do
            echo "$out" | grep -q "$want" || { echo "missing guidance: $want"; exit 1; }
          done
          if env PATH=/nonexistent "$BASH_BIN" ./admin.sh >/dev/null 2>&1; then
            echo 'exited 0 with nothing installed'; exit 1
          fi

          # The handover line itself, with ZERO arguments - the documented way to open the menu,
          # and the case `set -u` breaks on bash 3.2 (which is what macOS ships). The CI check
          # above never reaches it, so without this the line has no execution coverage anywhere.
          # A fake pwsh makes the exec succeed without launching the console.
          fake="$(mktemp -d)"
          printf '#!/bin/sh\necho "HANDOVER ok args=$#"\n' > "$fake/pwsh"
          chmod +x "$fake/pwsh"
          out="$(PATH="$fake:$PATH" ./admin.sh 2>&1)" || { echo "handover failed: $out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q 'HANDOVER ok' || { echo 'handover did not reach pwsh'; exit 1; }

          # Same again under the oldest bash on the box, explicitly, so the macOS default is
          # exercised rather than assumed.
          if [ -x /bin/bash ]; then
            out="$(PATH="$fake:$PATH" /bin/bash ./admin.sh 2>&1)" || { echo "/bin/bash handover failed: $out"; exit 1; }
            echo "/bin/bash ($(/bin/bash -c 'echo $BASH_VERSION')): $out"
          fi

          # Arguments must still be forwarded. The baseline is 3 (-NoProfile -File <path>), so
          # one extra argument makes 4.
          echo "$out" | grep -q 'args=3' || { echo "unexpected baseline argument count: $out"; exit 1; }
          out="$(PATH="$fake:$PATH" ./admin.sh -NonInteractive 2>&1)"
          echo "$out" | grep -q 'args=4' || { echo "arguments not forwarded: $out"; exit 1; }
          rm -rf "$fake"

  gate:
    name: Ironclad gate (packet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ledger checks read commit history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run the gate
        run: node .ironclad/gate.mjs --stage packet

      - name: Gate report (JSON)
        if: always()
        run: node .ironclad/gate.mjs --stage packet --no-run --json > ironclad-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ironclad-report
          path: ironclad-report.json
          if-no-files-found: ignore
