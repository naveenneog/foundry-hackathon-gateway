<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Styled with inline attributes, not a <style> block: GitHub's markdown sanitizer strips
       <style> from SVGs, which would render this diagram unstyled in the README. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect width="940" height="560" fill="#f6f8fa"/>

  <!-- Participant -->
  <rect x="40" y="40" width="230" height="96" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 48 40 L 262 40 A 8 8 0 0 1 270 48 L 270 70 L 40 70 L 40 48 A 8 8 0 0 1 48 40 Z" fill="#24292f"/>
  <text x="56" y="61" font-size="14" font-weight="600" fill="#ffffff">Participant</text>
  <text x="56" y="92" font-size="13" fill="#1f2328">opencode · OpenAI SDK · curl</text>
  <text x="56" y="112" font-size="11.5" fill="#0550ae" font-family="Consolas, monospace">OPENAI_BASE_URL</text>
  <text x="56" y="128" font-size="11.5" fill="#0550ae" font-family="Consolas, monospace">OPENAI_API_KEY = &lt;signed JWT&gt;</text>

  <path d="M 270 88 L 350 88" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="80" font-size="11.5" fill="#57606a" text-anchor="middle">Bearer</text>

  <!-- Gateway -->
  <rect x="350" y="40" width="410" height="330" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 358 40 L 752 40 A 8 8 0 0 1 760 48 L 760 70 L 350 70 L 350 48 A 8 8 0 0 1 358 40 Z" fill="#0969da"/>
  <text x="366" y="61" font-size="14" font-weight="600" fill="#ffffff">Azure API Management — AI gateway</text>

  <text x="366" y="94"  font-size="13" font-weight="600" fill="#1f2328">1</text>
  <text x="386" y="94"  font-size="13" fill="#1f2328">validate-jwt</text>
  <text x="560" y="94"  font-size="11.5" fill="#57606a">signature · nbf · exp</text>
  <text x="706" y="94"  font-size="11.5" fill="#cf222e" font-family="Consolas, monospace">401</text>

  <text x="366" y="120" font-size="13" font-weight="600" fill="#1f2328">2</text>
  <text x="386" y="120" font-size="13" fill="#1f2328">revocation denylist</text>
  <text x="560" y="120" font-size="11.5" fill="#57606a">jti</text>
  <text x="706" y="120" font-size="11.5" fill="#cf222e" font-family="Consolas, monospace">403</text>

  <text x="366" y="146" font-size="13" font-weight="600" fill="#1f2328">3</text>
  <text x="386" y="146" font-size="13" fill="#1f2328">model allowlist</text>
  <text x="560" y="146" font-size="11.5" fill="#57606a">signed claim</text>
  <text x="706" y="146" font-size="11.5" fill="#cf222e" font-family="Consolas, monospace">403</text>

  <text x="366" y="172" font-size="13" font-weight="600" fill="#1f2328">4</text>
  <text x="386" y="172" font-size="13" fill="#1f2328">one-time budget</text>
  <text x="560" y="172" font-size="11.5" fill="#57606a">does not reset</text>
  <text x="706" y="172" font-size="11.5" fill="#cf222e" font-family="Consolas, monospace">403</text>

  <text x="366" y="198" font-size="13" font-weight="600" fill="#1f2328">5</text>
  <text x="386" y="198" font-size="13" fill="#1f2328">llm-token-limit</text>
  <text x="560" y="198" font-size="11.5" fill="#57606a">tokens / minute</text>
  <text x="706" y="198" font-size="11.5" fill="#cf222e" font-family="Consolas, monospace">429</text>

  <text x="366" y="224" font-size="13" font-weight="600" fill="#1f2328">6</text>
  <text x="386" y="224" font-size="13" fill="#1f2328">rate-limit-by-key</text>
  <text x="560" y="224" font-size="11.5" fill="#57606a">requests / minute</text>
  <text x="706" y="224" font-size="11.5" fill="#cf222e" font-family="Consolas, monospace">429</text>

  <text x="366" y="250" font-size="13" font-weight="600" fill="#1f2328">7</text>
  <text x="386" y="250" font-size="13" fill="#1f2328">llm-emit-token-metric</text>
  <text x="560" y="250" font-size="11.5" fill="#57606a">per participant</text>

  <text x="366" y="276" font-size="13" font-weight="600" fill="#1f2328">8</text>
  <text x="386" y="276" font-size="13" fill="#1f2328">alias → deployment</text>
  <text x="560" y="276" font-size="11.5" fill="#57606a">flash · pro</text>

  <line x1="366" y1="292" x2="744" y2="292" stroke="#d0d7de" stroke-width="1"/>

  <text x="366" y="316" font-size="13" font-weight="600" fill="#1f2328">9</text>
  <text x="386" y="316" font-size="13" fill="#1f2328">managed identity swap</text>
  <text x="386" y="336" font-size="11.5" fill="#57606a">participant token discarded; gateway calls Foundry as itself</text>
  <text x="386" y="356" font-size="11.5" fill="#57606a">audience:</text>
  <text x="450" y="356" font-size="11.5" fill="#0550ae" font-family="Consolas, monospace">https://ai.azure.com</text>

  <path d="M 555 370 L 555 424" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Foundry -->
  <rect x="350" y="424" width="410" height="96" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 358 424 L 752 424 A 8 8 0 0 1 760 432 L 760 454 L 350 454 L 350 432 A 8 8 0 0 1 358 424 Z" fill="#8250df"/>
  <text x="366" y="445" font-size="14" font-weight="600" fill="#ffffff">Microsoft Foundry</text>
  <text x="366" y="478" font-size="13" fill="#1f2328">deepseek-v4-flash</text>
  <text x="560" y="478" font-size="11.5" fill="#57606a">DeepSeek-V4-Flash-0731</text>
  <text x="366" y="502" font-size="13" fill="#1f2328">deepseek-v4-pro</text>
  <text x="560" y="502" font-size="11.5" fill="#57606a">DeepSeek-V4-Pro</text>

  <!-- Denials return to the caller without ever reaching a model -->
  <path d="M 760 172 C 830 172 830 88 772 88" stroke="#cf222e" stroke-width="1.4" fill="none"
        stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="845" y="212" font-size="11.5" fill="#57606a" text-anchor="middle">denied at the</text>
  <text x="845" y="228" font-size="11.5" fill="#57606a" text-anchor="middle">gateway — no</text>
  <text x="845" y="244" font-size="11.5" fill="#57606a" text-anchor="middle">model cost</text>

  <!-- Admin -->
  <rect x="40" y="180" width="230" height="190" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 48 180 L 262 180 A 8 8 0 0 1 270 188 L 270 210 L 40 210 L 40 188 A 8 8 0 0 1 48 180 Z" fill="#1a7f37"/>
  <text x="56" y="201" font-size="14" font-weight="600" fill="#ffffff">admin.ps1</text>
  <text x="56" y="232" font-size="13" fill="#1f2328">Pin models</text>
  <text x="56" y="254" font-size="13" fill="#1f2328">Issue key — offline, instant</text>
  <text x="56" y="276" font-size="13" fill="#1f2328">Set window + budget</text>
  <text x="56" y="298" font-size="13" fill="#1f2328">Revoke</text>
  <text x="56" y="320" font-size="13" fill="#1f2328">Show consumption</text>
  <text x="56" y="348" font-size="11.5" fill="#57606a">Signs with the HS256 secret</text>

  <path d="M 270 250 L 350 172" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="286" y="238" font-size="11.5" fill="#57606a">mints</text>

  <!-- Observability -->
  <rect x="40" y="424" width="230" height="96" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 48 424 L 262 424 A 8 8 0 0 1 270 432 L 270 454 L 40 454 L 40 432 A 8 8 0 0 1 48 424 Z" fill="#9a6700"/>
  <text x="56" y="445" font-size="14" font-weight="600" fill="#ffffff">Observability</text>
  <text x="56" y="478" font-size="13" fill="#1f2328">Application Insights</text>
  <text x="56" y="502" font-size="13" fill="#1f2328">Log Analytics</text>

  <path d="M 350 250 L 300 250 L 300 424" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="294" y="404" font-size="11.5" fill="#57606a" text-anchor="end">metrics</text>

  <text x="470" y="546" font-size="11.5" fill="#57606a">No model credential exists on any participant machine.</text>
</svg>
