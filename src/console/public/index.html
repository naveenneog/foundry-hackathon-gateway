<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Key Dashboard · Foundry Gateway Key Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Cpath d='M19.5 7.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM15.6 16.4 7.5 24.5M10.5 21.5l2.5 2.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <link rel="modulepreload" href="/lib.js">
  <link rel="modulepreload" href="/api.js">
  <link rel="modulepreload" href="/dom.js">
  <link rel="modulepreload" href="/charts.js">
  <link rel="modulepreload" href="/secret.js">
  <link rel="modulepreload" href="/views-drawer.js">
  <link rel="modulepreload" href="/views-issue.js">
  <link rel="modulepreload" href="/views-keys.js">
  <link rel="modulepreload" href="/views-overview.js">
  <link rel="modulepreload" href="/views-admin.js">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="signed-out" class="banner" role="alert" hidden>
    <p>Your session has ended. <a href="/.auth/login/aad?post_login_redirect_uri=/">Sign in again</a>. Anything typed on this page is lost when you do.</p>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect class="brand-bg" width="28" height="28" rx="7"/>
          <path class="brand-key" d="M17 6.5a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6zM13.6 14.4 6.5 21.5M8.9 19.1l2.2 2.2"/>
        </svg>
        <span class="brand-text"><span class="brand-name">Foundry Gateway</span><span class="brand-product">Key Dashboard</span></span>
      </a>
      <div class="topbar-tools">
        <div id="theme-switch"></div>
        <p class="who"><span class="sr-only">Signed in as </span><span id="who-name" class="who-name"></span> <span id="who-role" class="role" hidden></span></p>
        <a class="signout" href="/.auth/logout">Sign out</a>
      </div>
    </div>
    <nav class="nav" aria-label="Sections">
      <ul id="nav-list" class="nav-list"></ul>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div class="view">
      <div class="state state-loading" role="status">
        <span class="sr-only">Loading the dashboard…</span>
        <div class="skeleton sk-0" aria-hidden="true"></div>
        <div class="skeleton sk-1" aria-hidden="true"></div>
        <div class="skeleton sk-2" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">The Key Dashboard needs JavaScript.</p></noscript>
</body>
</html>
